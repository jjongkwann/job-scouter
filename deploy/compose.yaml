# 서버 상시 가동 서비스. temporal은 워크플로 서버, io/llm은 워커,
# api는 JSON API(:8091, LAN 비공개), web은 브라우저가 보는 Next.js(:8090).
# 변수(DATA_REPO·CLAUDE_CODE_OAUTH_TOKEN·GIT_AUTHOR_*)는 deploy/.env — server.env.example 참조.
name: jobscouter

services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db --log-level warn
    ports:
      - "7233:7233"   # gRPC — 워커
      - "8233:8233"   # UI
    volumes:
      - ${HOME}/.temporal:/data   # SQLite 영속 — 컨테이너 재생성에도 이력 유지
    restart: always

  io:
    build: ..
    command: ["/app/.venv/bin/python", "-m", "jobscouter.worker", "io"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"   # 컨테이너 로그에 print가 바로 보이게
      JOBSCOUTER_TEMPORAL: temporal:7233
      JOBSCOUTER_ES: http://host.docker.internal:9200
      JOBSCOUTER_JOBFEED: /work/repo/jobfeed
      JOBSCOUTER_FACTBASE: /work/repo/references/이력서_사실베이스.md
      JOBSCOUTER_PROMPTS: /work/repo/job-scouter/prompts
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME}   # git commit엔 AUTHOR·COMMITTER 둘 다 필요
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL}
    volumes:
      - ${DATA_REPO}:/work/repo
      - ${HOME}/.git-credentials:/root/.git-credentials:ro   # push 인증 — io만
      - hf-cache:/root/.cache/huggingface                     # bge-m3 캐시 — io만
      - jobscouter-data:/app/data                             # judgments 캐시 — io/llm 공용
    extra_hosts:
      - host.docker.internal:host-gateway   # 호스트 네이티브 ES(:9200) 접근
    restart: always
    depends_on:
      - temporal

  llm:
    build: ..
    command: ["/app/.venv/bin/python", "-m", "jobscouter.worker", "llm"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"   # 컨테이너 로그에 print가 바로 보이게
      JOBSCOUTER_TEMPORAL: temporal:7233
      JOBSCOUTER_ES: http://host.docker.internal:9200
      JOBSCOUTER_JOBFEED: /work/repo/jobfeed
      JOBSCOUTER_FACTBASE: /work/repo/references/이력서_사실베이스.md
      JOBSCOUTER_PROMPTS: /work/repo/job-scouter/prompts
    volumes:
      - ${DATA_REPO}:/work/repo
      - jobscouter-data:/app/data
      # 호스트 Claude Code 로그인 공유 — 디렉터리째 마운트. 파일 하나만 마운트하면 호스트가 토큰을
      # 갱신(원자적 교체)할 때 inode가 바뀌어 컨테이너 쪽이 깨진다(2026-08-26 실측: Not logged in).
      # 없으면 CLAUDE_CODE_OAUTH_TOKEN(.env)로 대체.
      - ${HOME}/.claude:/root/.claude
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always
    depends_on:
      - temporal

  api:
    build: ..
    command: ["/app/.venv/bin/uvicorn", "jobscouter.api:app", "--host", "0.0.0.0", "--port", "8091"]
    # LAN 포트 없음 — 브라우저는 web만 본다. api는 compose 네트워크 안에서만 열린다.
    environment:
      PYTHONUNBUFFERED: "1"
      JOBSCOUTER_TEMPORAL: temporal:7233
      JOBSCOUTER_ES: http://host.docker.internal:9200
      JOBSCOUTER_JOBFEED: /work/repo/jobfeed
      JOBSCOUTER_FACTBASE: /work/repo/references/이력서_사실베이스.md
      JOBSCOUTER_PROMPTS: /work/repo/job-scouter/prompts
    volumes:
      - ${DATA_REPO}:/work/repo:ro   # API는 파일을 쓰지 않는다 — 쓰기는 워크플로(io 워커)만
    restart: always
    depends_on:
      - temporal

  web:
    build: ../web
    environment:
      API_URL: http://api:8091
    ports:
      - "8090:3000"   # LAN 대시보드 — 인증 없음, 포트포워딩 금지
    restart: always
    depends_on:
      - api

volumes:
  hf-cache:
  jobscouter-data:
