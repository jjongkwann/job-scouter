# 서버(OrbStack) 상시 가동 3서비스. temporal은 워크플로 서버, io/llm은 워커.
# 변수(DATA_REPO·CLAUDE_CODE_OAUTH_TOKEN·GIT_AUTHOR_*)는 deploy/.env — server.env.example 참조.
name: jobscouter

services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db --log-level warn
    ports:
      - "7233:7233"   # gRPC — 워커
      - "8233:8233"   # UI
    volumes:
      - ${HOME}/.temporal:/data   # SQLite 영속 — 컨테이너 재생성에도 이력 유지
    restart: always

  io:
    build: ..
    command: ["uv", "run", "python", "-m", "jobscouter.worker", "io"]
    env_file: .env
    environment:
      JOBSCOUTER_TEMPORAL: temporal:7233
      JOBSCOUTER_ES: http://host.docker.internal:9200
      JOBSCOUTER_JOBFEED: /work/repo/jobfeed
      JOBSCOUTER_FACTBASE: /work/repo/references/이력서_사실베이스.md
      JOBSCOUTER_PROMPTS: /work/repo/job-scouter/prompts
      JOBSCOUTER_PY: /app/.venv/bin/python
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME}   # git commit엔 AUTHOR·COMMITTER 둘 다 필요
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL}
    volumes:
      - ${DATA_REPO}:/work/repo
      - ${HOME}/.git-credentials:/root/.git-credentials:ro   # push 인증 — io만
      - hf-cache:/root/.cache/huggingface                     # bge-m3 캐시 — io만
      - jobscouter-data:/app/data                             # judgments 캐시 — io/llm 공용
    extra_hosts:
      - host.docker.internal:host-gateway   # 호스트 네이티브 ES(:9200) 접근
    restart: always
    depends_on:
      - temporal

  llm:
    build: ..
    command: ["uv", "run", "python", "-m", "jobscouter.worker", "llm"]
    env_file: .env
    environment:
      JOBSCOUTER_TEMPORAL: temporal:7233
      JOBSCOUTER_ES: http://host.docker.internal:9200
      JOBSCOUTER_JOBFEED: /work/repo/jobfeed
      JOBSCOUTER_FACTBASE: /work/repo/references/이력서_사실베이스.md
      JOBSCOUTER_PROMPTS: /work/repo/job-scouter/prompts
      JOBSCOUTER_PY: /app/.venv/bin/python
    volumes:
      - ${DATA_REPO}:/work/repo
      - jobscouter-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always
    depends_on:
      - temporal

volumes:
  hf-cache:
  jobscouter-data:
