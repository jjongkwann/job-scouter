[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscouter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "elasticsearch>=8.17,<9",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "temporalio>=1.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
